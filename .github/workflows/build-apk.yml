name: Build & Release Debug APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release with direct APK download'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (leave blank to use automated tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment
        run: |
          echo "Setting up build environment..."
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore is present
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkey -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify & Prepare APK Artifact
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          mkdir -p release-output
          cp "$APK_PATH" release-output/pipchat-v0.1-debug.apk
          cp "$APK_PATH" release-output/pipchat-debug.apk

          FILE_SIZE=$(du -h release-output/pipchat-debug.apk | cut -f1)
          SHA256=$(sha256sum release-output/pipchat-debug.apk | awk '{print $1}')

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

          echo "APK Size: $FILE_SIZE"
          echo "SHA256: $SHA256"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipchat-debug-apk
          path: release-output/pipchat-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_tag
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1-preview"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: Publish Direct Download GitHub Release
        if: |
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/') ||
           github.ref == 'refs/heads/main' ||
           (github.event_name == 'workflow_dispatch' && inputs.create_release == true))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "PipChat v0.1 Debug APK (${{ steps.release_tag.outputs.tag }})"
          body: |
            ## 📱 PipChat AI Forex & Gold Analyst — Debug APK

            ### ⬇️ Direct Download Link
            👉 **[Download pipchat-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/pipchat-debug.apk)**

            ---

            ### 📦 Build Details
            - **File Name**: `pipchat-debug.apk`
            - **File Size**: `${{ steps.apk_info.outputs.file_size }}`
            - **SHA-256**: `${{ steps.apk_info.outputs.sha256 }}`
            - **Commit**: `${{ github.sha }}`

            ---

            ### ✨ Key Features Included
            - 📈 **AI Forex & Gold Technical Analyst** (Gemini AI + Tool Calling)
            - 📊 **Interactive Candlestick Chart Canvas** (M15, H1, H4, D1) with TP1, TP2, Entry, & SL levels
            - 🔐 **Authentication Options**:
              - Sign in with Apple (HIG-compliant with Private Relay email mask support)
              - Google OAuth login
              - 6-Digit SMS/Email OTP (Passwordless)
              - Demo Trader (Instant Guest Access)
            - 🎯 **Structured Signal Cards** with Risk/Reward ratios and technical indicators
            - 💾 **Local Offline Storage** (Room Database persistence)
            - ⚙️ **Customizable Preferences**: Risk level (1%–3%), Trading Style, Language (ID/EN), Dark/Light theme
          files: |
            release-output/pipchat-debug.apk
            release-output/pipchat-v0.1-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
